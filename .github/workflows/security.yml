name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache-dependency-path: |
            backend/go.sum
            LaborCheckTool/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Prepare embedded frontend placeholder
        run: mkdir -p backend/internal/http/web/dist && touch backend/internal/http/web/dist/index.html
      - name: Scan backend
        working-directory: backend
        run: govulncheck ./...
      - name: Scan LaborCheckTool
        working-directory: LaborCheckTool
        run: govulncheck ./...
